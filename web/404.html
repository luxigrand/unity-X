<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sayfa bulunamadı — Cortex Neuro</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="https://cortex-neuro.net/404.html" />
  <style>
    :root {
      --bg: #e6e9ef; --text: #3a4150; --muted: #6b7385; --accent: #6c7ae0;
      --shadow-dark: #c5c9d0; --shadow-light: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: grid; place-items: center; padding: 2rem;
    }
    .box {
      max-width: 28rem; text-align: center; padding: 2.5rem 1.75rem;
      border-radius: 24px;
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
    }
    .mark { font-weight: 700; color: var(--accent); margin-bottom: 1rem; }
    h1 { font-size: 1.6rem; margin-bottom: 0.6rem; }
    p { color: var(--muted); margin-bottom: 1.5rem; }
    a {
      display: inline-flex; padding: 0.85rem 1.5rem; border-radius: 999px;
      font-weight: 600; color: #fff; text-decoration: none;
      background: linear-gradient(145deg, #7a87e8, #5d6bd4);
    }
  </style>
</head>
<body>
  <div class="box">
    <p class="mark">Cortex Neuro</p>
    <h1>Bu sayfa yok</h1>
    <p>Aradığınız adres taşınmış veya hiç oluşturulmamış olabilir.</p>
    <a href="/">Ana sayfaya dön</a>
  </div>
</body>
</html>
